name: Update HF Space Data
on:
  # Triggered after inference-daily workflow completes successfully
  workflow_run:
    workflows: ["inference-daily"]
    types:
      - completed
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  update-space:
    runs-on: ubuntu-latest
    # Only run if inference-daily succeeded (or manual trigger)
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Upload to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx huggingface-cli upload gzsol/github_trend_predictor \
            ./predictions.json \
            predictions.json \
            --repo-type space \
            --token $HF_TOKEN
